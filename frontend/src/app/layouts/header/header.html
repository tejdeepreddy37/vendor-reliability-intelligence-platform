<header class="header">

  <div class="header-left">
    <div class="breadcrumb">
      <span class="breadcrumb-brand">VRIP</span>
      <span class="breadcrumb-separator">/</span>
      <span class="breadcrumb-muted">Procurement Intelligence</span>
      <span class="breadcrumb-separator">/</span>
      <strong>Workspace</strong>
    </div>
  </div>

  <div class="header-right">

    <button
      type="button"
      class="header-icon-button"
      aria-label="Procurement Alerts & Notifications"
      (click)="navigateTo('/notifications')"
      title="Alerts & Notifications"
    >
      <svg
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
        <path d="M10 21h4"></path>
      </svg>
      <span class="notification-dot"></span>
    </button>

    <div class="header-divider"></div>

    <ng-container *ngIf="currentUser$ | async as user; else guestUser">
      <div class="user-menu-container">
        <button
          type="button"
          class="user-menu"
          (click)="toggleUserMenu()"
          aria-label="User account"
        >
          <span class="user-avatar">{{ authService.getUserInitials(user.full_name) }}</span>

          <span class="user-details">
            <strong>{{ user.full_name }}</strong>
            <small>{{ authService.getRoleDisplayName(user.role) }}</small>
          </span>

          <svg
            class="user-chevron"
            [class.rotated]="showMenu"
            viewBox="0 0 24 24"
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <div *ngIf="showMenu" class="user-dropdown">
          <div class="dropdown-header">
            <strong>{{ user.full_name }}</strong>
            <span>{{ user.email }}</span>
            <span class="role-tag">{{ authService.getRoleDisplayName(user.role) }}</span>
          </div>

          <div class="dropdown-divider"></div>

          <button type="button" class="dropdown-item" (click)="navigateTo('/dashboard')">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7" rx="1"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1"></rect>
            </svg>
            <span>Dashboard</span>
          </button>

          <button type="button" class="dropdown-item danger" (click)="logout()">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Sign Out</span>
          </button>
        </div>
      </div>
    </ng-container>

    <ng-template #guestUser>
      <div class="user-menu-container">
        <button
          type="button"
          class="user-menu"
          (click)="navigateTo('/login')"
        >
          <span class="user-avatar">?</span>
          <span class="user-details">
            <strong>Account</strong>
            <small>Sign In</small>
          </span>
        </button>
      </div>
    </ng-template>

  </div>

</header>
