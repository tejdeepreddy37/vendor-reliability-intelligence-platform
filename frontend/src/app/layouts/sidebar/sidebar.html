<aside class="sidebar">

  <!-- TOP BRAND & USER PROFILE (MATCHING REFERENCE IMAGE) -->
  <div class="sidebar-top-section">
    <div class="sidebar-brand-title">
      <h2>VRIP Board</h2>
    </div>

    <!-- USER PROFILE PHOTO / MONOGRAM CARD (LIKE REFERENCE) -->
    <div class="sidebar-user-header" *ngIf="currentUser$ | async as user">
      <div class="user-avatar-ring">
        <div class="user-avatar-inner">{{ authService.getUserInitials(user.full_name) }}</div>
      </div>
      <div class="user-profile-title">
        <span class="user-name-label">{{ user.full_name }}</span>
        <span class="user-role-badge">{{ authService.getRoleDisplayName(user.role) }}</span>
      </div>
    </div>
  </div>

  <!-- NAVIGATION ITEMS (UPPERCASE & CRISP LIKE REFERENCE) -->
  <nav class="sidebar-nav">

    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item"
      title="Intelligence Dashboard"
    >
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </span>
      <span class="nav-label">DASHBOARD</span>
    </a>

    <a
      routerLink="/vendors"
      routerLinkActive="active"
      class="nav-item"
      title="Vendor Directory"
    >
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </span>
      <span class="nav-label">VENDORS</span>
    </a>

    <a
      routerLink="/purchase-orders"
      routerLinkActive="active"
      class="nav-item"
      title="Purchase Orders"
    >
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
      </span>
      <span class="nav-label">PURCHASE ORDERS</span>
    </a>

    <a
      routerLink="/contracts"
      routerLinkActive="active"
      class="nav-item"
      title="Contracts & Compliance"
    >
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"></path>
          <path d="M14 2v6h6"></path>
          <path d="M8 13h8"></path>
          <path d="M8 17h6"></path>
        </svg>
      </span>
      <span class="nav-label">CONTRACTS</span>
    </a>

    <a
      routerLink="/procurement"
      routerLinkActive="active"
      class="nav-item"
      title="Procurement Requisitions"
    >
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
        </svg>
      </span>
      <span class="nav-label">PROCUREMENT</span>
    </a>

    <a
      routerLink="/risk"
      routerLinkActive="active"
      class="nav-item"
      title="Procurement Risk Management"
    >
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"></path>
          <path d="M12 8v4"></path>
          <path d="M12 16h.01"></path>
        </svg>
      </span>
      <span class="nav-label">RISK INTEL</span>
    </a>

    <a
      routerLink="/vendor-performance"
      routerLinkActive="active"
      class="nav-item"
      title="Vendor Performance Scoring"
    >
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 3v18h18"></path>
          <rect x="7" y="12" width="3" height="6" rx=".5"></rect>
          <rect x="12" y="8" width="3" height="10" rx=".5"></rect>
          <rect x="17" y="5" width="3" height="13" rx=".5"></rect>
        </svg>
      </span>
      <span class="nav-label">PERFORMANCE</span>
    </a>

    <a
      routerLink="/communications"
      routerLinkActive="active"
      class="nav-item"
      title="Supplier Communications"
    >
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
      </span>
      <span class="nav-label">MESSAGES</span>
    </a>

    <a
      routerLink="/reports"
      routerLinkActive="active"
      class="nav-item"
      title="Procurement & Vendor Reports"
    >
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
      </span>
      <span class="nav-label">REPORTS</span>
    </a>

    <a
      routerLink="/notifications"
      routerLinkActive="active"
      class="nav-item"
      title="System Notifications"
    >
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
          <path d="M10 21h4"></path>
        </svg>
      </span>
      <span class="nav-label">NOTIFICATIONS</span>
    </a>

  </nav>

  <!-- SIDEBAR FOOTER (POSTGRESQL STATUS & SIGN OUT) -->
  <div class="sidebar-bottom">
    <div class="system-status">
      <span class="status-dot"></span>
      <div>
        <strong>PostgreSQL Live</strong>
        <small>Real-time Intelligence</small>
      </div>
    </div>

    <button type="button" class="btn-signout" (click)="logout()" title="Sign Out">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Sign Out</span>
    </button>
  </div>

</aside>
